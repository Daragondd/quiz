<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choice</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/choice.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="logo">
            <img src="images/Logo.png" alt="logo">
        </div>
    </div>
</header>

<section class="choice">
    <div class="container choice_container">
        <div class="choice_content">
            <h2 class="title choice_title">Выберите <span>тему теста</span></h2>
            <p class="choice_description">
                Чтобы начать тест, выберите одну из предложенных ниже тем.
            </p>
            <div class="choice_options" id="choice_options">

            </div>
        </div>
        <div class="choice_image">
            <img src="images/choice_image.png" alt="Choice image">
        </div>
    </div>
</section>
<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>
<script src="scripts/common.js"></script>
<script src="scripts/choice.js"></script>
</body>
</html>
