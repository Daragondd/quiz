<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="logo">
            <img src="images/Logo.png" alt="logo">
        </div>
    </div>
</header>

<section class="form">
    <div class="container form_container">
        <div class="form_content">
            <h2 class="form_title title">
                Введите свои <span>данные</span>
            </h2>
            <form action="" class="form_details">
                <div class="form_group">
                    <input type="text" class="form_input" id="name" required>
                    <label for="name" class="form_label">Имя</label>
                </div>
                <div class="form_group">
                    <input type="text" class="form_input" id="surname" required>
                    <label for="surname" class="form_label">Фамилия</label>
                </div>
                <div class="form_group">
                    <input type="text" class="form_input" id="email" required>
                    <label for="email" class="form_label">Электронная почта</label>
                </div>
                <div class="form_agree">
                    <input type="checkbox" id="agree" required>
                    <label for="agree" class="form_agree_label">Я ознакомлен с <a href="#">правилами сайта</a></label>
                </div>
            </form>
            <button class="button button_colorful" id="process" disabled>Перейти к выбору теста</button>
        </div>
        <div class="form_image">
            <img src="images/form_image.png" alt="Character">
        </div>
    </div>
</section>
<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>
<script src="scripts/form.js"></script>
</body>
</html>
