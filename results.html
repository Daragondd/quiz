<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Results</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/results.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="logo">
            <img src="images/Logo.png" alt="logo">
        </div>
    </div>
</header>

<section class="results">
    <div class="container results_container">
        <div class="pre_title_group">
            <h3 class="pre_title">Результат прохождения теста</h3>
            <img src="images/arrow_gray.png" alt="Next_arrow">
            <h3 class="pre_title pre_title_colorful" id="pre_title"></h3>
        </div>
        <h2 class="big_title"><span>Правильные ответы</span> к тесту</h2>
        <div class="results_items" id="results_items">

        </div>
        <a class="link_skip" id="return">
            <p class="link_skip_text">Обратно к моему результату теста</p>
            <img src="images/next.png" alt="Next_arrow">
        </a>
    </div>
</section>
<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>
<script src="scripts/results.js"></script>
</body>
</html>
