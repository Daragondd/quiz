<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test</title>
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/test.css">
</head>
<body>
<header class="header">
    <div class="container">
        <div class="logo">
            <img src="images/Logo.png" alt="logo">
        </div>
    </div>
</header>

<section class="test">
    <div class="container test_container">
        <h3 class="pre_title" id="pre_title">Тест №1. “JavaScript: Начальный уровень”</h3>
        <div class="test_progress_bar" id='progress_bar'>
        </div>
        <div class="test_question">
            <h2 class="test_title" id="test_title"><span>Вопрос 2:</span> Тут должен быть текст вопроса?</h2>
            <div class="test_question_options" id="test_question_options">
            </div>
        </div>
        <div class="test_actions">
            <button class="button button_border test_previous_action" id="previous" disabled>Назад</button>
            <div class="test_timer">
                <div class="test_timer_text">Осталось времени</div>
                <div class="test_timer_clock" id="timer">59</div>
            </div>
            <button class="button button_border test_next_action" id="next" disabled>Вперед</button>
        </div>
        <a class="link_skip">
            <p class="link_skip_text" id="pass">Пропустить вопрос</p>
            <img src="images/next.png" alt="Next_arrow">
        </a>
    </div>
</section>
<footer class="footer">
    «АйтилогияQuiz» © Все права защищены / 2022
</footer>

<script src="scripts/common.js"></script>
<script src="scripts/test.js"></script>
</body>
</html>
